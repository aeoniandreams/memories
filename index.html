<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>memories — X 대화 백업</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%231d9bf0%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z%22/><path d=%22M16.5 18.5c-3-1.5-3-3.5-3-4a1.5 1.5 0 0 1 3 0 1.5 1.5 0 0 1 3 0c0 .5 0 2.5-3 4Z%22/></svg>" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/npm/pretendard-jp@1.3.9/dist/web/static/pretendard-jp.css" />
<link rel="stylesheet" href="css/style.css" />
<script>
  // 저장된 테마를 CSS/본문이 그려지기 전에 미리 적용해서 화면이 잠깐 반대 테마로 번쩍이는 걸 막습니다.
  try {
    const saved = localStorage.getItem("memories-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
</script>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-view" class="view">
  <form id="login-form" class="login-card">
    <button class="theme-toggle-btn" type="button" aria-label="야간 모드 전환">🌙</button>
    <h1>ハクメイの永遠</h1>
    <p class="login-sub">울집쭈 아카이브</p>
    <input type="email" id="login-email" placeholder="이메일" autocomplete="username" required />
    <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password" required />
    <button type="submit">로그인</button>
    <p id="login-error" class="error-text" hidden></p>
  </form>
</div>

<!-- 메인 앱 화면 -->
<div id="app-view" class="view" hidden>
  <header class="app-header">
    <h1>memories</h1>
    <div class="header-actions">
      <button id="new-card-btn" class="btn-primary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 새 대화 추가</button>
      <button id="logout-btn" class="btn-ghost">로그아웃</button>
      <button class="theme-toggle-btn btn-ghost" type="button" aria-label="야간 모드 전환">🌙</button>
    </div>
  </header>

  <div class="toolbar">
    <select id="tag-filter-select" class="btn-secondary"></select>
    <button id="sort-toggle-btn" class="btn-secondary" type="button">최신순 ▾</button>
  </div>

  <main id="card-grid" class="card-grid" aria-live="polite"></main>
  <p id="empty-state" class="empty-state" hidden>아직 백업된 대화가 없어요. "새 대화 추가"로 첫 대화를 백업해보세요.</p>
</div>

<!-- 대화 상세 보기 모달 -->
<div id="detail-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <button id="detail-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <div class="modal-header-right">
        <button id="detail-append-btn" class="btn-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 이어서 추가</button>
        <button id="detail-edit-btn" class="btn-secondary">수정</button>
        <button id="detail-delete-btn" class="btn-ghost danger">삭제</button>
      </div>
    </div>
    <div id="detail-thread" class="thread"></div>
  </div>
</div>

<!-- 이미지 코멘트 보기 -->
<div id="comment-modal" class="modal-overlay" hidden>
  <div class="modal-panel comment-modal-panel">
    <div class="modal-header">
      <button id="comment-modal-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    </div>
    <p id="comment-modal-text" class="comment-modal-text"></p>
  </div>
</div>

<!-- 새 대화 추가 / 편집 모달 -->
<div id="new-card-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <button id="new-card-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 취소</button>
      <button id="new-card-save-btn" class="btn-primary">저장</button>
    </div>

    <p id="append-mode-label" class="append-mode-label" hidden>기존 대화 아래로 이어서 추가하는 중이에요.</p>

    <section class="tag-editor">
      <label>태그 (필터에서 사용, 카드에는 표시되지 않아요. 원하는 태그를 눌러서 선택/해제하세요)</label>
      <div id="tag-options" class="tag-options"></div>
    </section>

    <section class="import-section">
      <label for="import-textarea">
        북마클릿으로 복사한 내용을 여기에 붙여넣으세요
        (<a href="bookmarklet.html" target="_blank" rel="noopener">북마클릿 설치/사용법</a>)
      </label>
      <textarea id="import-textarea" rows="4" placeholder='[{"avatar":"...","nickname":"...","handle":"@...","dateDisplay":"2026.09.02.","text":"...","images":["..."]}, ...]'></textarea>
      <div class="import-actions">
        <button id="import-parse-btn" class="btn-secondary">불러오기</button>
        <button id="add-empty-message-btn" class="btn-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 메시지 직접 추가</button>
      </div>
      <p id="import-error" class="error-text" hidden></p>
    </section>

    <section id="editable-rows" class="editable-rows"></section>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
