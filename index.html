<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>memories — ハクメイの永遠</title>
<link rel="icon" type="image/png" href="favicon.png?v=1" />
<!-- Pretendard JP를 외부 CDN이 아니라 이 저장소 안 fonts/ 폴더에서 직접 서빙합니다
     (자세한 이유는 css/fonts.css 상단 주석 참고). 실제로 쓰는 굵기만 미리 받아둬서,
     CSS 해석을 기다리지 않고 최대한 일찍 받기 시작하도록 preload도 걸어둡니다. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/PretendardJP-Regular.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/PretendardJP-Medium.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/PretendardJP-SemiBold.woff2" />
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/PretendardJP-Bold.woff2" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/style.css" />
<script>
  // 저장된 테마를 CSS/본문이 그려지기 전에 미리 적용해서 화면이 잠깐 반대 테마로 번쩍이는 걸 막습니다.
  try {
    const saved = localStorage.getItem("memories-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
</script>
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-view" class="view">
  <form id="login-form" class="login-card">
    <button class="theme-toggle-btn" type="button" aria-label="야간 모드 전환">🌙</button>
    <h1>ハクメイの永遠</h1>
    <p class="login-sub">울집쭈 아카이브</p>
    <input type="email" id="login-email" placeholder="이메일" autocomplete="username" required />
    <input type="password" id="login-password" placeholder="비밀번호" autocomplete="current-password" required />
    <button type="submit">로그인</button>
    <p id="login-error" class="error-text" hidden></p>
  </form>
</div>

<!-- 우측 사이드바: X 백업 / 카카오톡 백업 화면을 서로 전환합니다. 로그인
     상태에서만 보입니다. -->
<div id="app-sidebar" class="app-sidebar" hidden>
  <button id="sidebar-x-btn" class="app-sidebar-btn selected" type="button" aria-label="X 백업">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
  </button>
  <button id="sidebar-kakao-btn" class="app-sidebar-btn" type="button" aria-label="카카오톡 백업">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.477 3 2 6.463 2 10.74c0 2.72 1.822 5.11 4.573 6.478-.201.75-.727 2.72-.833 3.142-.13.522.19.516.402.375.166-.11 2.638-1.79 3.708-2.52.696.103 1.417.157 2.15.157 5.523 0 10-3.463 10-7.632C22 6.463 17.523 3 12 3Z"/></svg>
  </button>
</div>

<!-- 메인 앱 화면 (X 백업) -->
<div id="app-view" class="view" hidden>
  <header class="app-header">
    <h1>memories</h1>
    <div class="header-actions">
      <button id="new-card-btn" class="btn-primary" aria-label="새 대화 추가"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg><span class="btn-label"> 새 대화 추가</span></button>
      <button id="logout-btn" class="btn-ghost">로그아웃</button>
      <button class="theme-toggle-btn btn-ghost" type="button" aria-label="야간 모드 전환">🌙</button>
      <button class="sidebar-menu-btn btn-ghost" type="button" aria-label="메뉴"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg></button>
    </div>
  </header>

  <div class="toolbar">
    <select id="tag-filter-select" class="btn-secondary"></select>
    <button id="sort-toggle-btn" class="btn-secondary" type="button">최신순 ▾</button>
  </div>

  <main id="card-grid" class="card-grid" aria-live="polite"></main>
  <p id="empty-state" class="empty-state" hidden>아직 백업된 대화가 없어요. "새 대화 추가"로 첫 대화를 백업해보세요.</p>
</div>

<!-- 카카오톡 백업 화면. X 화면과 완전히 분리된 별도의 Firestore 컬렉션
     (kakaoCards)을 씁니다. -->
<div id="kakao-app-view" class="view" hidden>
  <header class="app-header">
    <h1>memories · 카카오톡</h1>
    <div class="header-actions">
      <button id="kakao-new-card-btn" class="btn-primary" aria-label="새 대화 추가"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button id="kakao-logout-btn" class="btn-ghost">로그아웃</button>
      <button class="theme-toggle-btn btn-ghost" type="button" aria-label="야간 모드 전환">🌙</button>
      <button class="sidebar-menu-btn btn-ghost" type="button" aria-label="메뉴"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/></svg></button>
    </div>
  </header>

  <main id="kakao-card-grid" class="card-grid" aria-live="polite"></main>
  <p id="kakao-empty-state" class="empty-state" hidden>아직 백업된 카카오톡 대화가 없어요. "＋"로 첫 대화를 백업해보세요.</p>
</div>

<!-- 카카오톡 대화 내보내기 텍스트 붙여넣기 -->
<div id="kakao-new-card-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <button id="kakao-new-card-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 취소</button>
      <button id="kakao-new-card-save-btn" class="btn-primary" hidden>저장</button>
    </div>

    <section class="import-section">
      <label for="kakao-import-textarea">
        카카오톡 채팅방 설정 → "대화 내용 내보내기"로 저장한 텍스트를 붙여넣거나,
        내보낸 .eml/.txt 파일을 바로 선택하세요
      </label>
      <textarea id="kakao-import-textarea" rows="6" placeholder="OO 님과 카카오톡 대화&#10;저장한 날짜 : ...&#10;&#10;2026년 1월 1일 오후 3:22, OO : 안녕하세요"></textarea>
      <div class="import-actions">
        <button id="kakao-import-parse-btn" class="btn-secondary">불러오기</button>
        <label class="btn-secondary kakao-file-label">
          파일 선택(.eml/.txt)
          <input type="file" id="kakao-file-input" accept=".eml,.txt,message/rfc822" hidden />
        </label>
      </div>
      <p id="kakao-import-error" class="error-text" hidden></p>
    </section>

    <section id="kakao-preview-section" class="kakao-preview-section" hidden>
      <label>대화 상대 중 누가 "나"인가요? (내 메시지가 오른쪽 말풍선으로 표시됩니다)</label>
      <div id="kakao-sender-options" class="kakao-sender-options"></div>
      <p class="kakao-preview-hint">말풍선 사이 "+ 이미지 추가"를 누르면 원하는 위치에 이미지를 넣을 수 있어요.</p>
      <div id="kakao-preview-thread" class="kakao-thread kakao-preview-thread"></div>
    </section>
  </div>
</div>

<!-- 카카오톡 대화 상세 보기 -->
<div id="kakao-detail-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <button id="kakao-detail-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <div class="modal-header-right">
        <button id="kakao-detail-delete-btn" class="btn-ghost danger">삭제</button>
      </div>
    </div>
    <div id="kakao-detail-thread" class="kakao-thread"></div>
  </div>
</div>

<!-- 대화 상세 보기 모달 -->
<div id="detail-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <button id="detail-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <div class="modal-header-right">
        <button id="detail-append-btn" class="btn-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 이어서 추가</button>
        <button id="detail-edit-btn" class="btn-secondary">수정</button>
        <button id="detail-delete-btn" class="btn-ghost danger">삭제</button>
      </div>
    </div>
    <div id="detail-thread" class="thread"></div>
  </div>

  <!-- 트윗 코멘트 보기/작성/수정. 데스크탑에서는 위 대화창 옆 우측 공간에 뜨고,
       모바일(가로/세로 공통)에서는 화면 아래에서 올라오는 바텀시트 형태로 뜹니다
       (css의 media query 참고). -->
  <div id="tweet-comment-panel" class="tweet-comment-panel" hidden>
    <div class="tweet-comment-panel-card">
      <div class="modal-header">
        <button id="tweet-comment-panel-back-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <div class="modal-header-right">
          <button id="tweet-comment-panel-action-btn" class="btn-secondary" hidden></button>
          <button id="tweet-comment-panel-delete-btn" class="btn-ghost danger" hidden>삭제</button>
        </div>
      </div>
      <div id="tweet-comment-panel-body" class="tweet-comment-panel-body"></div>
    </div>
  </div>
</div>

<!-- 이미지 코멘트 보기 (대화 상세 화면 안, 트윗에 붙은 이미지용). 트윗 코멘트
     패널(#tweet-comment-panel)과 완전히 같은 레이아웃 클래스를 씁니다: 데스크탑에서는
     대화창 옆에, 모바일에서는 아래에서 올라오는 바텀시트로 뜹니다. -->
<div id="comment-modal" class="tweet-comment-panel" hidden>
  <div class="tweet-comment-panel-card">
    <div class="modal-header">
      <button id="comment-modal-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <button id="comment-modal-action-btn" class="btn-secondary" hidden></button>
    </div>
    <div id="comment-modal-body" class="tweet-comment-panel-body"></div>
  </div>
</div>

<!-- 이미지 코멘트 보기 (홈 화면 카드 썸네일용). 옆에 뜰 "대화창" 자체가 없는
     상황이라, 원래 방식대로 배경을 어둡게 덮고 화면 가운데에 뜨는 모달을 씁니다. -->
<div id="thumb-comment-modal" class="modal-overlay" hidden>
  <div class="modal-panel comment-modal-panel">
    <div class="modal-header">
      <button id="thumb-comment-modal-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    </div>
    <p id="thumb-comment-modal-text" class="comment-modal-text"></p>
  </div>
</div>

<!-- 이미지 원본 크게 보기 (대화 이미지, 코멘트 이미지 공통). 새 탭으로 이동하는
     대신 화면 가운데에 어두운 배경과 함께 이미지만 원래 비율로 띄웁니다. -->
<div id="image-viewer-modal" class="modal-overlay image-viewer-modal" hidden>
  <button id="image-viewer-close-btn" class="image-viewer-close-btn" aria-label="닫기"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <img id="image-viewer-img" class="image-viewer-img" alt="" />
</div>

<!-- 새 대화 추가 / 편집 모달 -->
<div id="new-card-modal" class="modal-overlay" hidden>
  <div class="modal-panel">
    <div class="modal-header">
      <button id="new-card-close-btn" class="btn-ghost"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 취소</button>
      <button id="new-card-save-btn" class="btn-primary">저장</button>
    </div>

    <p id="append-mode-label" class="append-mode-label" hidden>기존 대화 아래로 이어서 추가하는 중이에요.</p>

    <section class="tag-editor">
      <label>태그 (필터에서 사용, 카드에는 표시되지 않아요. 원하는 태그를 눌러서 선택/해제하세요)</label>
      <div id="tag-options" class="tag-options"></div>
    </section>

    <section class="import-section">
      <label for="import-textarea">
        북마클릿으로 복사한 내용을 여기에 붙여넣으세요
        (<a href="bookmarklet.html" target="_blank" rel="noopener">북마클릿 설치/사용법</a>)
      </label>
      <textarea id="import-textarea" rows="4" placeholder='[{"avatar":"...","nickname":"...","handle":"@...","dateDisplay":"2026.09.02.","text":"...","images":["..."]}, ...]'></textarea>
      <div class="import-actions">
        <button id="import-parse-btn" class="btn-secondary">불러오기</button>
        <button id="add-empty-message-btn" class="btn-secondary"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 메시지 직접 추가</button>
      </div>
      <p id="import-error" class="error-text" hidden></p>
    </section>

    <section id="editable-rows" class="editable-rows"></section>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
